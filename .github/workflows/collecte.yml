name: Collecte Velib

on:
  schedule:
    # Toutes les 15 min (dépôt public : minutes GitHub Actions illimitées),
    # décalé des minutes rondes, les plus chargées chez GitHub.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write # nécessaire pour enregistrer les fichiers dans le dépôt

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Relever les stations
        run: python3 collect.py

      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "collecte-bot"
          git config user.email "collecte-bot@users.noreply.github.com"
          git add data
          git commit -m "Relevé $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase
          git push
